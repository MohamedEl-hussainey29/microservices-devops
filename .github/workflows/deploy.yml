name: Deploy microservices
on:
  push:
    branches:
      - master
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
 
      - run: docker build -t mowalid29/multi-client ./client
      - run: docker build -t mowalid29/multi-server ./server
      - run: docker build -t mowalid29/multi-nginx ./nginx
      - run: docker build -t mowalid29/multi-worker ./worker

      - run: docker push mowalid29/multi-client
      - run: docker push mowalid29/multi-server
      - run: docker push mowalid29/multi-nginx
      - run: docker push mowalid29/multi-worker